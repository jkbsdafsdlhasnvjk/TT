name: Kinogryz Golyak 37s final masked subtitles
on:
  push:
    paths: [".github/workflows/golyak_render_masked.yml"]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Compile and verify word censorship
        run: |
          python -m py_compile scripts/render_golyak.py scripts/render_uploaded_scene.py scripts/censor_golyak_words.py
          python scripts/censor_golyak_words.py
      - name: Prepare FFmpeg
        run: bash scripts/check_ffmpeg.sh
      - name: Download original scene from Drive
        run: |
          python -m pip install -q gdown
          gdown "https://drive.google.com/uc?id=140eY6m7vzI0TNuyCCMl9zX4ECQrSK_Bd" -O golyak_original.mp4
      - name: Render with six stars masking each censored word
        run: |
          python scripts/render_golyak.py
          python - <<'PY'
          import json
          from pathlib import Path
          w=json.loads(Path("golyak_ready/corrected_word_timestamps.json").read_text())
          assert sum("******" in x["word"] for x in w)==8
          assert sum("******" in x for x in Path("golyak_ready/burned_word_subtitles.ass").read_text().splitlines())>0
          print("SUBTITLE_CENSOR_QA_PASS",sum("******" in x["word"] for x in w),flush=True)
          PY
      - name: Publish masked MP4 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kinogryz-golyak-37s-stars-subs-mp4
          path: golyak_ready/Kinogryz_Golyak_Belka_37s_Vertical_RU_Captions.mp4
          retention-days: 30
          compression-level: 0
          if-no-files-found: warn
      - name: Publish subtitle and QA files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kinogryz-golyak-37s-stars-subs-qa
          path: |
            golyak_ready/*.ass
            golyak_ready/*.json
            golyak_ready/*.txt
          retention-days: 30
          if-no-files-found: warn
      - name: Direct MP4 download on GitHub release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create kinogryz-golyak-belka-37s-censored-v2 golyak_ready/Kinogryz_Golyak_Belka_37s_Vertical_RU_Captions.mp4 --title "КиноГрызь — Голяк, белка, 37 сек — 8 слов заменены звёздочками" --notes "В этой версии восемь грубых слов в СУБТИТРАХ заменены на ******, с сохранением пословной подсветки. Исходный звук не изменён. Видео 37.23 сек, 1080×1920, без зеркалирования."
