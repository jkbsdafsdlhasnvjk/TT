name: Kinogryz Men of Honor HD verified montage
on:
  push:
    paths:
      - .github/workflows/men_of_honor_render.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: bash scripts/check_ffmpeg.sh
      - name: Install HD media downloader and Russian ASR
        run: python -m pip install -q yt-dlp numpy faster-whisper==1.2.1
      - name: Download verified real 1920x1080 original with Russian audio
        run: |
          yt-dlp --no-progress --no-playlist -f hls-5404 --concurrent-fragments 8 --retries 7 --fragment-retries 7 "https://ok.ru/video/7191873522312" -o movie_1080.mp4
          ffprobe -v error -show_entries format=duration,size:stream=width,height,codec_name -of json movie_1080.mp4
      - name: Reconstruct 78 verified film shots exactly in portrait
        run: |
          python -m py_compile scripts/men_of_honor_hd_verified.py scripts/men_of_honor_caption_render.py
          python scripts/men_of_honor_hd_verified.py --movie movie_1080.mp4 --shots scripts/men_of_honor_shots.json --output men_montage_hd.mp4
      - name: Render 1080x1920 blurred background and timed Russian karaoke captions
        run: |
          python scripts/men_of_honor_caption_render.py --source men_montage_hd.mp4 --output Voenny_Nyryalshchik_2000_1080p_9x16_Kinogryz.mp4
      - name: Validate video and audio tracks
        run: |
          ffprobe -v error -show_entries format=duration,size:stream=codec_type,width,height,codec_name -of json Voenny_Nyryalshchik_2000_1080p_9x16_Kinogryz.mp4
      - name: Archive finished MP4 and QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Men-of-Honor-HD-9x16-finished
          path: |
            Voenny_Nyryalshchik_2000_1080p_9x16_Kinogryz.mp4
            men_render/
          if-no-files-found: warn
          retention-days: 30
      - name: Publish direct downloadable MP4
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create men-of-honor-20261022-9x16-hd Voenny_Nyryalshchik_2000_1080p_9x16_Kinogryz.mp4 --title "КиноГрызь: Военный ныряльщик (2000), HD 9:16" --notes "HD кадры из исходного фильма, 78 восстановленных монтажных переходов, 1080x1920 с размытым фоном без зеркалирования, вшитые русские пословные субтитры." 
