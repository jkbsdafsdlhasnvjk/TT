name: Kinogryz pony clip audio and video inspection
on:
  push:
    paths: [".github/workflows/pony_clip_inspect.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Prepare FFmpeg
        run: bash scripts/check_ffmpeg.sh
      - name: Set up speech recognition
        run: python -m pip install -q faster-whisper==1.2.1 numpy gdown
      - name: Download exact user video from Google Drive
        run: gdown --fuzzy "https://drive.google.com/file/d/1WQrBSFa66b_oMnQHpruJxfyy_py7tEwX/view" -O pony_scene.mp4
      - name: Analyze original video and Russian dialogue
        run: |
          python scripts/transcribe_single_scene.py pony_scene.mp4 pony_asr
          python - <<'PY'
          import json
          from pathlib import Path
          m= json.loads(Path("pony_asr/source_metadata.json").read_text())
          print("VIDEO_METADATA",json.dumps(m,ensure_ascii=False),flush=True)
          for model in ("medium","small"):
              ss=json.loads(Path(f"pony_asr/{model}_segments.json").read_text())
              print("MODEL_START",model,flush=True)
              for s in ss:
                  print("SPEECH",s["start"],s["end"],s["text"],flush=True)
                  for w in s["words"]:
                      print("WORD",model,w["start"],w["end"],w["prob"],w["word"],flush=True)
          PY
      - name: Save all transcript timings and original video metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kinogryz-pony-clip-asr-inspection
          path: pony_asr/
          retention-days: 30
