name: Men of Honor 87-cut HD fallback (720 source)
on:
  push:
    paths: [.github/workflows/men_of_honor_720_backup.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: bash scripts/check_ffmpeg.sh
      - name: Install source downloader
        run: python -m pip install -q yt-dlp
      - name: Download film in native 1280x720
        run: yt-dlp --no-progress --no-playlist -f hls-2589 --concurrent-fragments 10 --retries 7 --fragment-retries 7 "https://ok.ru/video/7191873522312" -o movie_720.mp4
      - name: Reconstruct all 87 matching shots
        run: python scripts/men_of_honor_picture_87.py --movie movie_720.mp4 --output men_precise_picture_1080x1920_silent.mp4
      - name: Archive backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: men-of-honor-faithful-87cut-720-backup
          path: |
            men_precise_picture_1080x1920_silent.mp4
            men_precise_qa/
          if-no-files-found: warn
          retention-days: 7
