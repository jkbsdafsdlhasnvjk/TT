name: Preserve S01 unverified MP4 artifacts before expiry

on:
  push:
    paths:
      - .github/workflows/s01_preserve_verified_source_archives.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: s01-unverified-preservation
  cancel-in-progress: false

env:
  BACKUP_TAG: s01-unverified-qa-backup-20261024
  GH_TOKEN: ${{ github.token }}

jobs:
  prepare_release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create private draft release for QA backups, not publication
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$BACKUP_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$BACKUP_TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --title "S01 UNVERIFIED backup — do not publish" \
              --notes "Backup of four chronological short-MP4 Actions artifacts, not a validated release. Subtitle wording/timing still require audio review. Files are split original artifact ZIPs. Concatenate chunks in lexical order to restore the original ZIP. Source artifacts expire 2026-11-22. Never upload these unverified files to Drive/Подготовленные."
          fi

  backup_canary:
    needs: prepare_release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Backup authoritative part 1 and verify original ZIP digest
        env:
          ARTIFACT_ID: "12488178386"
          PART: "1"
          EXPECTED_SHA256: "a03c1f820a55d55556029b8d2ae240d62d766d25badccd2a46570b59b752cf49"
        run: |
          set -euo pipefail
          df -h .
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > source.zip
          echo "$EXPECTED_SHA256  source.zip" | sha256sum --check --status
          test "$(stat -c%s source.zip)" -gt 3500000000
          split -b 1500m -d -a 2 source.zip "s01-unverified-part${PART}-zip-chunk-"
          for f in s01-unverified-part${PART}-zip-chunk-*; do
            gh release upload "$BACKUP_TAG" "$f" --repo "$GITHUB_REPOSITORY" --clobber
          done
          echo "Verified and preserved part $PART; original ZIP sha256=$EXPECTED_SHA256"

  backup_remaining:
    needs: backup_canary
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - part: "2"
            artifact: "12489180492"
            sha256: "b481aa69cf8443c81b064b12a8b089185b8015f456e48056f2ae0f0bd1850758"
          - part: "3"
            artifact: "12501837192"
            sha256: "8ba78b99f35ee575da4e90de6c0109bbd6bba4db9d64a0bd5c9619ed53f295e7"
          - part: "4"
            artifact: "12499355073"
            sha256: "c75c861169ad2504ea77e2973e066c501db603207768670d3842a4998872ec25"
    steps:
      - name: Backup authoritative repaired/original short MP4 archive
        env:
          ARTIFACT_ID: ${{ matrix.artifact }}
          PART: ${{ matrix.part }}
          EXPECTED_SHA256: ${{ matrix.sha256 }}
        run: |
          set -euo pipefail
          df -h .
          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" > source.zip
          echo "$EXPECTED_SHA256  source.zip" | sha256sum --check --status
          test "$(stat -c%s source.zip)" -gt 3500000000
          split -b 1500m -d -a 2 source.zip "s01-unverified-part${PART}-zip-chunk-"
          for f in s01-unverified-part${PART}-zip-chunk-*; do
            gh release upload "$BACKUP_TAG" "$f" --repo "$GITHUB_REPOSITORY" --clobber
          done
          echo "Verified and preserved part $PART; original ZIP sha256=$EXPECTED_SHA256"
