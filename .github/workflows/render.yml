name: Kinogryz full-source render test
on:
  push:
    paths: [".github/workflows/render.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: bash scripts/check_ffmpeg.sh
      - name: Download full season
        run: bash scripts/fetch_season.sh
      - name: Install Russian forced-alignment dependencies
        run: python -m pip install --upgrade pip && python -m pip install whisperx
      - name: Render goose scene with readable highlighted subtitles
        run: bash scripts/render_goose.sh
      - name: Save finished MP4
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kinogryz-goose-synced-v2
          path: "КиноГрызь_Гусь_версия_GitHub.mp4"
          retention-days: 7
