name: Kinogryz full-source render test
on:
  push:
    paths: [".github/workflows/render.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: bash scripts/check_ffmpeg.sh
      - name: Download full season
        run: bash scripts/fetch_season.sh
      - name: Render goose scene with readable highlighted subtitles
        run: bash scripts/render_goose.sh
      - name: Save alignment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kinogryz-alignment-debug-v8
          path: |
            goose_word_times.json
            captions.ass
          if-no-files-found: warn
          retention-days: 7
      - name: Save finished MP4
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kinogryz-goose-early-highlights-v8
          path: "КиноГрызь_Гусь_версия_GitHub.mp4"
          retention-days: 7
