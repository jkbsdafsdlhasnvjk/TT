name: Men of Honor HD render via portable FFmpeg
on:
  push:
    paths: [.github/workflows/men_of_honor_portable.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - name: Install portable libass FFmpeg, portable probe, Russian ASR and downloader
        run: |
          python -m pip install -q imageio-ffmpeg av faster-whisper==1.2.1 yt-dlp numpy
          mkdir -p .bin
          ln -sf "$(python -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')" .bin/ffmpeg
          printf '#!/usr/bin/env bash\npython3 scripts/ffprobe_jsonshim.py "$@"\n' > .bin/ffprobe
          chmod +x .bin/ffprobe
          echo "$PWD/.bin" >> "$GITHUB_PATH"
      - name: Download true 1080p film in transport stream
        run: |
          yt-dlp --fixup never --no-progress --no-playlist -f hls-5404 --concurrent-fragments 8 --retries 7 --fragment-retries 7 "https://ok.ru/video/7191873522312" -o movie_1080.ts
          ls -lh movie_1080.ts
      - name: Remux source for frame-accurate random seeking
        run: |
          ffmpeg -hide_banner -loglevel error -y -fflags +genpts -i movie_1080.ts -map 0:v:0 -map 0:a:0 -c copy movie_1080.mkv
          rm movie_1080.ts
          ffprobe -v error -show_entries format=duration,size:stream=width,height,codec_name -of json movie_1080.mkv
      - name: Reconstruct exactly 78 source scenes with corrected visual tracking
        run: |
          python -m py_compile scripts/men_of_honor_hd_verified.py scripts/men_of_honor_caption_render.py scripts/ffprobe_jsonshim.py
          python scripts/men_of_honor_hd_verified.py --movie movie_1080.mkv --shots scripts/men_of_honor_shots.json --output men_montage_hd.mp4
      - name: Build blurred vertical composition with Russian word-highlight subtitles
        run: python scripts/men_of_honor_caption_render.py --source men_montage_hd.mp4 --output Voenny_Nyryalshchik_Kinogryz_1080x1920.mp4
      - name: Verify completed MP4
        run: ffprobe -v error -show_entries format=duration,size:stream=codec_type,width,height,codec_name -of json Voenny_Nyryalshchik_Kinogryz_1080x1920.mp4
      - name: Store finished MP4 and verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Men-of-Honor-portable-HD-finished
          path: |
            Voenny_Nyryalshchik_Kinogryz_1080x1920.mp4
            men_render/
          if-no-files-found: warn
          retention-days: 30
      - name: Release playable MP4 for direct download
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create men-of-honor-20261022-hd-portable Voenny_Nyryalshchik_Kinogryz_1080x1920.mp4 --title "КиноГрызь: Военный ныряльщик HD 9:16" --notes "1920x1080 original master, portrait 1080x1920, blurred background, no mirror, 78 precise edited shots, Russian word-highlight captions."
