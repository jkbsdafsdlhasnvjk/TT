name: Chef compliment 32s word-by-word transcript audit
on:
  push:
    paths: [".github/workflows/chef_scene_asr.yml"]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve original cleanest saved render and transcript
        uses: actions/download-artifact@v4
        with:
          name: kinogryz-s01-part-1
          run-id: 39727987611
          github-token: ${{ github.token }}
          path: source_candidates
      - name: FFmpeg and Russian speech model
        run: |
          bash scripts/check_ffmpeg.sh
          python -m pip install -q numpy faster-whisper==1.2.1
      - name: Review all spoken words in 32-second chef scene
        run: |
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          import numpy as np
          from faster_whisper import WhisperModel
          src="source_candidates/Kinogryz_S01_01h03m_05.mp4"
          print("MEDIA",subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration,size:stream=codec_type,width,height","-of","json",src],text=True),flush=True)
          pcm=subprocess.check_output(["ffmpeg","-v","error","-i",src,"-t","36","-vn","-ac","1","-ar","16000","-f","s16le","-"])
          arr=np.frombuffer(pcm,dtype="<i2").astype(np.float32)/32768
          m=WhisperModel("medium",device="cpu",compute_type="int8",cpu_threads=4)
          segments,info=m.transcribe(arr,language="ru",word_timestamps=True,beam_size=5,temperature=0.,vad_filter=True)
          out=[]
          for seg in segments:
              print("SEG",round(seg.start,2),round(seg.end,2),seg.text,flush=True)
              for w in seg.words or []:
                  print("WORD",round(w.start,3),round(w.end,3),round(w.probability,2),repr(w.word),flush=True)
                  out.append(dict(start=round(w.start,3),end=round(w.end,3),prob=round(w.probability,3),text=w.word.strip()))
          Path("chef_asr_words.json").write_text(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chef-compliment-asr-words
          path: chef_asr_words.json
          retention-days: 14
