name: Kinogryz Season 1 pilot - speech-selected scenes
on:
  push:
    paths: [".github/workflows/season_pilot.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Prepare FFmpeg
        run: bash scripts/check_ffmpeg.sh
      - name: Download full season source
        run: bash scripts/fetch_season.sh
      - name: Install audio transcription
        run: python -m pip install -q numpy faster-whisper==1.2.1
      - name: Select completed dialogue moments and render three pilot clips
        run: python scripts/season_scenes.py --source season.mp4 --start 0 --end 1440 --per-bin 3 --max-clips 3 --out season_output
      - name: Upload scene plan, transcripts and MP4 previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kinogryz-season1-pilot-batch
          path: season_output/
          if-no-files-found: warn
          retention-days: 14
