name: Men of Honor 78-shot match with system FFmpeg
on:
  push:
    paths: [".github/workflows/men_of_honor_match_fast.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 48
    steps:
      - uses: actions/checkout@v4
      - name: Install system FFmpeg and matching tools
        run: |
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1
          python -m pip install -q yt-dlp numpy opencv-python-headless
      - name: Download and normalize film frames
        run: |
          yt-dlp --no-progress -f hls-757 --concurrent-fragments 8 --retries 7 --fragment-retries 7 "https://ok.ru/video/7191873522312" -o film_360.mp4
          file film_360.mp4
          ffprobe -v error -show_entries format=duration,size:stream=codec_type,width,height -of json film_360.mp4
      - name: Visually match 78 shot fingerprints
        run: python scripts/men_of_honor_match16.py film_360.mp4
      - name: Save map and quality metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: men-of-honor-78-shot-map-system
          path: men_shots_matched16.json
          if-no-files-found: warn
          retention-days: 30
