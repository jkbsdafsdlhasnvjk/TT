name: Men of Honor 78-shot match (standalone ffmpeg)
on:
  push:
    paths: [".github/workflows/men_of_honor_match_fast.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install no-apt video matcher
        run: |
          python -m pip install -q yt-dlp numpy opencv-python-headless imageio-ffmpeg
          mkdir -p "$RUNNER_TEMP/ffbin"
          ln -s "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" "$RUNNER_TEMP/ffbin/ffmpeg"
          echo "$RUNNER_TEMP/ffbin" >> "$GITHUB_PATH"
      - name: Download smaller 360p source
        run: yt-dlp --no-progress -f hls-757 --concurrent-fragments 8 --retries 7 --fragment-retries 7 "https://ok.ru/video/7191873522312" -o film_360.mp4
      - name: Match all 78 scene fingerprints
        run: python scripts/men_of_honor_match16.py film_360.mp4
      - name: Save exact mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: men-of-honor-78-shot-map-fast
          path: men_shots_matched16.json
          if-no-files-found: warn
          retention-days: 30
