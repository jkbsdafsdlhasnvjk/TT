name: Pony clip independent large-model word transcription
on:
  push:
    paths: [".github/workflows/pony_large_review.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg and recognition
        run: |
          bash scripts/check_ffmpeg.sh
          python -m pip install -q faster-whisper==1.2.1 numpy gdown
      - name: Download pony clip
        run: gdown "https://drive.google.com/uc?id=1WQrBSFa66b_oMnQHpruJxfyy_py7tEwX" -O pony.mp4
      - name: Third independent Russian word transcription
        run: |
          python - <<'PY'
          import json,subprocess
          import numpy as np
          from pathlib import Path
          from faster_whisper import WhisperModel
          raw=subprocess.check_output(["ffmpeg","-v","error","-i","pony.mp4","-ac","1","-ar","16000","-vn","-f","s16le","-"])
          wav=np.frombuffer(raw,dtype="<i2").astype("float32")/32768.
          model=WhisperModel("large-v3-turbo",device="cpu",compute_type="int8",cpu_threads=4)
          segments,_=model.transcribe(wav,language="ru",word_timestamps=True,beam_size=5,temperature=0.0,vad_filter=True)
          rows=[]
          for s in segments:
              print("LARGE_SEGMENT",round(s.start,2),round(s.end,2),s.text,flush=True)
              words=[]
              for w in s.words or []:
                  if w.start is None or w.end is None or w.end<=w.start:continue
                  words.append(dict(start=round(w.start,3),end=round(w.end,3),word=w.word.strip(),prob=round(w.probability or 0,3)))
                  print("LARGE_WORD",round(w.start,2),round(w.end,2),round(w.probability or 0,2),repr(w.word),flush=True)
              rows.append(dict(start=s.start,end=s.end,text=s.text,words=words))
          Path("pony_large_asr.json").write_text(json.dumps(rows,ensure_ascii=False,indent=2))
          print("DONE",sum(len(x["words"]) for x in rows),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pony-large-turbo-word-transcript
          path: pony_large_asr.json
          retention-days: 30
