name: Kinogryz uploaded 75s clip - transcribe and word QA
on:
  push:
    paths: [".github/workflows/uploaded_scene_asr.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: bash scripts/check_ffmpeg.sh
      - name: Install speech recognition and media transfer
        run: python -m pip install -q faster-whisper==1.2.1 numpy gdown
      - name: Download uploaded 75-second source video
        run: gdown "https://drive.google.com/uc?id=1qCSpjyRuj8vOPM7ouJiio0W5Bw_GjbWl" -O scene.mp4
      - name: Run two Russian speech transcriptions and inspect word timing
        run: python scripts/transcribe_single_scene.py scene.mp4 scene_asr
      - name: Preserve exact transcript and source metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kinogryz-uploaded-scene-word-inspection
          path: scene_asr/
          retention-days: 30
