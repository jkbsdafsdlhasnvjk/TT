name: Kinogryz Season 1 - full coverage
on:
  push:
    paths: [".github/workflows/season_full.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  season_batch:
    name: "Season 1 speech scenes / part ${{ matrix.part }}"
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {part: 1, begin: 1440, finish: 7200}
          - {part: 2, begin: 7200, finish: 14400}
          - {part: 3, begin: 14400, finish: 21600}
          - {part: 4, begin: 21600, finish: 28596}
    steps:
      - uses: actions/checkout@v4
      - name: FFmpeg prerequisites
        run: bash scripts/check_ffmpeg.sh
      - name: Download user-provided 640x360 source
        run: bash scripts/fetch_season.sh
      - name: Install audio transcription
        run: python -m pip install -q numpy faster-whisper==1.2.1
      - name: Select spoken scenes and render continuous highlighted Russian subtitles
        run: python scripts/season_scenes.py --source season.mp4 --start ${{ matrix.begin }} --end ${{ matrix.finish }} --per-bin 3 --max-clips 0 --out "season_part_${{ matrix.part }}"
      - name: Save scene plan, per-word subtitle timings and MP4 files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kinogryz-s01-part-${{ matrix.part }}
          path: season_part_${{ matrix.part }}/
          if-no-files-found: warn
          retention-days: 14
