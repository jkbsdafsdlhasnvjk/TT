name: Kinogryz Golyak clip speech and picture audit
on:
  push:
    paths: [".github/workflows/golyak_inspect.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: FFmpeg, subtitles dependencies and Whisper
        run: |
          bash scripts/check_ffmpeg.sh
          python -m pip install -q faster-whisper==1.2.1 numpy pillow gdown
      - name: Download original user uploaded Golyak
        run: gdown "https://drive.google.com/uc?id=140eY6m7vzI0TNuyCCMl9zX4ECQrSK_Bd" -O golyak_original.mp4
      - name: Extract metadata and transcribe all spoken words in Russian
        run: |
          python scripts/transcribe_single_scene.py golyak_original.mp4 golyak_asr
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("golyak_asr")
          print("VIDEO_METADATA", (root/"source_metadata.json").read_text(),flush=True)
          for m in ("medium","small"):
              ss=json.loads((root/(m+"_segments.json")).read_text())
              for s in ss:
                  print("SPEECH",m,s["start"],s["end"],s["text"],flush=True)
                  for w in s["words"]:
                      print("WORD",m,w["start"],w["end"],w["prob"],w["word"],flush=True)
          PY
      - name: Contact sheet for identifying screen and subtitles
        run: |
          python - <<'PY'
          import json,io,subprocess,base64
          from PIL import Image,ImageDraw
          meta=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_entries","format=duration","-of","json","golyak_original.mp4"],text=True))
          duration=float(meta["format"]["duration"])
          print("SOURCE_DURATION",duration,flush=True)
          canvas=Image.new("RGB",(1140,680),(12,12,20));d=ImageDraw.Draw(canvas)
          for i,fraction in enumerate([.03,.2,.4,.6,.8,.97]):
              t=duration*fraction
              b=subprocess.check_output(["ffmpeg","-v","error","-ss",str(t),"-i","golyak_original.mp4","-frames:v","1","-vf","scale=360:-2","-f","image2pipe","-vcodec","mjpeg","-"])
              im=Image.open(io.BytesIO(b)).convert("RGB"); im.thumbnail((360,300))
              x=(i%3)*380+10;y=(i//3)*330+10
              canvas.paste(im,(x,y));d.text((x,y+303),f"{t:.2f}s",fill="white")
          out=io.BytesIO();canvas.save(out,"JPEG",quality=72,optimize=True)
          print("GOLYAK_CONTACT_START",flush=True)
          print(base64.b64encode(out.getvalue()).decode(),flush=True)
          print("GOLYAK_CONTACT_END",flush=True)
          PY
      - name: Preserve inspected source metadata and transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kinogryz-golyak-inspection
          path: golyak_asr/
          retention-days: 30
          if-no-files-found: warn
