name: Men of Honor HD source probe
on:
  push:
    paths:
      - .github/workflows/men_of_honor_probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install downloader
        run: python -m pip install -q yt-dlp
      - name: Check public HD source resolution and access
        run: |
          set -x
          yt-dlp --version
          yt-dlp -F --no-playlist "https://ok.ru/video/7191873522312" | tee formats.txt
          yt-dlp --no-download --print "TITLE=%(title)s DURATION=%(duration)s HEIGHT=%(height)s" "https://ok.ru/video/7191873522312"
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: men-of-honor-source-probe
          path: formats.txt
          if-no-files-found: warn
          retention-days: 7
