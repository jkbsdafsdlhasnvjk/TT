name: Men of Honor scene matching
on:
  push:
    paths:
      - .github/workflows/men_of_honor_probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Install 360p extractor and pHash dependencies
        run: python -m pip install -q yt-dlp numpy opencv-python-headless
      - name: Download reference-resolution full film for shot matching
        run: |
          yt-dlp -f hls-757 --no-playlist --concurrent-fragments 8 --retries 7 --fragment-retries 7 "https://ok.ru/video/7191873522312" -o "film_360.mp4"
          ffprobe -v error -show_entries format=duration,size:stream=width,height,codec_name -of json film_360.mp4
      - name: Locate all 60 unique moments within the full film
        run: python scripts/men_of_honor_match.py film_360.mp4
      - name: Upload scene matching report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: men-of-honor-scene-map
          path: men_match.json
          if-no-files-found: warn
          retention-days: 7
